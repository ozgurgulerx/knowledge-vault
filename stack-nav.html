<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stack Nav</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0e0e10;
    --surface: #16161a;
    --surface-hover: #1c1c22;
    --surface-active: #22222a;
    --border: #2a2a32;
    --border-subtle: #1e1e26;
    --text: #f4f3f1;
    --text-secondary: #a8a6b0;
    --text-tertiary: #7d7a88;
    --accent: #d4a843;
    --accent-dim: rgba(212, 168, 67, 0.12);
    --accent-glow: rgba(212, 168, 67, 0.06);
    --folder-icon: #d4a843;
    --file-md: #7c9cba;
    --file-pdf: #c4645c;
    --file-pptx: #c47a4a;
    --file-other: #8b8994;
    --radius: 8px;
    --sidebar-width: 340px;
    --transition-push: 320ms cubic-bezier(0.32, 0.72, 0, 1);
  }

  body {
    font-family: 'DM Sans', -apple-system, sans-serif;
    background: #08080a;
    color: var(--text);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 128px;
    pointer-events: none;
    z-index: 9999;
  }

  .sidebar {
    width: var(--sidebar-width);
    height: 90vh;
    max-height: 700px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.02),
      0 20px 60px rgba(0,0,0,0.5),
      0 0 120px var(--accent-glow);
  }

  /* Search */
  .search-container {
    padding: 16px 16px 0;
    flex-shrink: 0;
  }

  .search-box {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius);
    padding: 0 12px;
    height: 36px;
    transition: border-color 200ms, box-shadow 200ms;
  }

  .search-box:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }

  .search-box svg {
    width: 14px;
    height: 14px;
    color: var(--text-tertiary);
    flex-shrink: 0;
  }

  .search-box input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
  }

  .search-box input::placeholder { color: var(--text-tertiary); }

  .search-shortcut {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-tertiary);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    flex-shrink: 0;
  }

  /* Recents */
  .recents-strip {
    padding: 12px 16px 0;
    flex-shrink: 0;
  }

  .recents-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-tertiary);
    margin-bottom: 8px;
  }

  .recents-row {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 2px;
  }
  .recents-row::-webkit-scrollbar { display: none; }

  .recent-chip {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 5px;
    background: var(--surface);
    border: 1px solid var(--border-subtle);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 11px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 150ms;
    max-width: 120px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .recent-chip:hover {
    background: var(--surface-hover);
    color: var(--text);
    border-color: var(--border);
  }

  .recent-chip .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* Breadcrumb */
  .breadcrumb-bar {
    padding: 12px 16px 0;
    flex-shrink: 0;
  }

  .breadcrumb {
    display: flex;
    align-items: center;
    gap: 2px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .breadcrumb::-webkit-scrollbar { display: none; }

  .breadcrumb-seg {
    color: var(--text-tertiary);
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 3px;
    white-space: nowrap;
    transition: color 150ms, background 150ms;
  }

  .breadcrumb-seg:hover {
    color: var(--accent);
    background: var(--accent-dim);
  }

  .breadcrumb-seg.active {
    color: var(--text);
    cursor: default;
  }
  .breadcrumb-seg.active:hover { background: none; color: var(--text); }

  .breadcrumb-sep {
    color: var(--text-tertiary);
    opacity: 0.4;
    flex-shrink: 0;
    user-select: none;
  }

  /* Divider */
  .divider {
    height: 1px;
    background: var(--border-subtle);
    margin: 12px 16px 0;
    flex-shrink: 0;
  }

  /* Card stack viewport */
  .stack-viewport {
    flex: 1;
    overflow: hidden;
    position: relative;
  }

  .stack-card {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 8px 0;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
    will-change: transform, opacity;
  }

  .stack-card::-webkit-scrollbar { width: 4px; }
  .stack-card::-webkit-scrollbar-track { background: transparent; }
  .stack-card::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* Push/pop animations */
  .stack-card.entering-right {
    animation: slideInRight var(--transition-push) forwards;
  }
  .stack-card.exiting-left {
    animation: slideOutLeft var(--transition-push) forwards;
  }
  .stack-card.entering-left {
    animation: slideInLeft var(--transition-push) forwards;
  }
  .stack-card.exiting-right {
    animation: slideOutRight var(--transition-push) forwards;
  }

  @keyframes slideInRight {
    from { transform: translateX(100%); opacity: 0.5; }
    to   { transform: translateX(0); opacity: 1; }
  }
  @keyframes slideOutLeft {
    from { transform: translateX(0); opacity: 1; }
    to   { transform: translateX(-30%); opacity: 0; }
  }
  @keyframes slideInLeft {
    from { transform: translateX(-30%); opacity: 0.5; }
    to   { transform: translateX(0); opacity: 1; }
  }
  @keyframes slideOutRight {
    from { transform: translateX(0); opacity: 1; }
    to   { transform: translateX(100%); opacity: 0; }
  }

  /* List items */
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 16px;
    cursor: pointer;
    transition: background 120ms;
    position: relative;
  }

  .nav-item:hover { background: var(--surface-hover); }
  .nav-item:active { background: var(--surface-active); }

  .nav-item.selected {
    background: var(--accent-dim);
  }
  .nav-item.selected::before {
    content: '';
    position: absolute;
    left: 0;
    top: 4px;
    bottom: 4px;
    width: 2px;
    background: var(--accent);
    border-radius: 0 2px 2px 0;
  }

  .nav-icon {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 13px;
  }

  .nav-icon.folder {
    background: var(--accent-dim);
    color: var(--folder-icon);
  }

  .nav-icon.file-md {
    background: rgba(124, 156, 186, 0.1);
    color: var(--file-md);
  }

  .nav-icon.file-pdf {
    background: rgba(196, 100, 92, 0.1);
    color: var(--file-pdf);
  }

  .nav-icon.file-pptx {
    background: rgba(196, 122, 74, 0.1);
    color: var(--file-pptx);
  }

  .nav-icon.file-other {
    background: rgba(139, 137, 148, 0.08);
    color: var(--file-other);
  }

  .nav-icon svg {
    width: 14px;
    height: 14px;
  }

  .nav-details {
    flex: 1;
    min-width: 0;
  }

  .nav-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.3;
  }

  .nav-meta {
    font-size: 11px;
    color: var(--text-tertiary);
    margin-top: 1px;
  }

  .nav-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-tertiary);
    background: var(--surface);
    border: 1px solid var(--border-subtle);
    border-radius: 10px;
    padding: 1px 7px;
    flex-shrink: 0;
  }

  .nav-chevron {
    color: var(--text-tertiary);
    opacity: 0;
    transition: opacity 150ms;
    flex-shrink: 0;
  }
  .nav-item:hover .nav-chevron { opacity: 1; }

  /* Search results */
  .search-results {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    padding: 8px 0;
    background: var(--bg);
    z-index: 10;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .search-group-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-tertiary);
    padding: 10px 16px 4px;
  }

  .search-empty {
    text-align: center;
    padding: 40px 16px;
    color: var(--text-tertiary);
    font-size: 13px;
  }

  .search-empty-icon {
    display: block;
    font-size: 24px;
    margin-bottom: 8px;
    opacity: 0.4;
  }

  /* Item stagger animation */
  .nav-item {
    animation: fadeUp 250ms ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Footer */
  .sidebar-footer {
    padding: 10px 16px;
    border-top: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .footer-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-tertiary);
  }

  .footer-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0.6;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }
</style>
</head>

// Helpers
function escHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.textContent;
}

function getExt(name) {
  const m = name.match(/\.(\w+)$/);
  return m ? m[1].toLowerCase() : '';
}

function getFileClass(name) {
  const ext = getExt(name);
  if (ext === 'md') return 'file-md';
  if (ext === 'pdf') return 'file-pdf';
  if (['pptx', 'ppt'].includes(ext)) return 'file-pptx';
  return 'file-other';
}

function createSvg(paths) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '2');
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  paths.forEach(d => {
    if (d.startsWith('M') || d.startsWith('m')) {
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('d', d);
      svg.appendChild(p);
    } else if (d.startsWith('rect:')) {
      const parts = d.replace('rect:', '').split(',');
      const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      r.setAttribute('x', parts[0]); r.setAttribute('y', parts[1]);
      r.setAttribute('width', parts[2]); r.setAttribute('height', parts[3]);
      if (parts[4]) r.setAttribute('rx', parts[4]);
      svg.appendChild(r);
    } else if (d.startsWith('circle:')) {
      const parts = d.replace('circle:', '').split(',');
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', parts[0]); c.setAttribute('cy', parts[1]); c.setAttribute('r', parts[2]);
      svg.appendChild(c);
    } else if (d.startsWith('line:')) {
      const parts = d.replace('line:', '').split(',');
      const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      l.setAttribute('x1', parts[0]); l.setAttribute('y1', parts[1]);
      l.setAttribute('x2', parts[2]); l.setAttribute('y2', parts[3]);
      svg.appendChild(l);
    } else if (d.startsWith('polyline:')) {
      const pts = d.replace('polyline:', '');
      const pl = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
      pl.setAttribute('points', pts);
      svg.appendChild(pl);
    }
  });
  return svg;
}

const ICONS = {
  folder: ['M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z'],
  md: ['M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z', 'polyline:14 2 14 8 20 8', 'line:16,13,8,13', 'line:16,17,8,17'],
  pdf: ['M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z', 'polyline:14 2 14 8 20 8'],
  pptx: ['rect:2,3,20,14,2', 'line:8,21,16,21', 'line:12,17,12,21'],
  other: ['M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z', 'polyline:13 2 13 9 20 9'],
  chevron: ['polyline:9 18 15 12 9 6'],
};

function getIconPaths(name) {
  const ext = getExt(name);
  if (ext === 'md') return ICONS.md;
  if (ext === 'pdf') return ICONS.pdf;
  if (['pptx', 'ppt'].includes(ext)) return ICONS.pptx;
  return ICONS.other;
}

function formatDate(d) {
  if (!d) return '';
  const date = new Date(d);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[date.getMonth()] + ' ' + date.getDate();
}

function sortItems(items) {
  return [...items].sort((a, b) => {
    if (a.type !== b.type) return a.type === 'folder' ? -1 : 1;
    return a.name.localeCompare(b.name);
  });
}

function getCurrentFolder() {
  let node = DATA;
  for (const seg of pathStack) {
    node = node.children.find(c => c.name === seg && c.type === 'folder');
    if (!node) return DATA;
  }
  return node;
}

function countItems(folder) {
  return (folder.children || []).length;
}

function getDisplayName(name) {
  return name.replace(/\.\w+$/, '').replace(/_/g, ' ');
}

// Breadcrumb
function renderBreadcrumb() {
  const el = document.getElementById('breadcrumb');
  el.replaceChildren();
  const segs = ['useful', ...pathStack];
  segs.forEach((s, i) => {
    if (i > 0) {
      const sep = document.createElement('span');
      sep.className = 'breadcrumb-sep';
      sep.textContent = '/';
      el.appendChild(sep);
    }
    const span = document.createElement('span');
    const isLast = i === segs.length - 1;
    span.className = isLast ? 'breadcrumb-seg active' : 'breadcrumb-seg';
    span.textContent = s;
    if (!isLast) {
      span.addEventListener('click', () => popTo(i));
    }
    el.appendChild(span);
  });
}

// Build a nav item DOM element
function createNavItem(item, index) {
  const row = document.createElement('div');
  row.className = 'nav-item';
  if (item.type === 'file' && selectedFile === item.name) row.classList.add('selected');
  row.style.animationDelay = (index * 25) + 'ms';
  row.dataset.name = item.name;
  row.dataset.type = item.type;

  const icon = document.createElement('div');
  icon.className = 'nav-icon ' + (item.type === 'folder' ? 'folder' : getFileClass(item.name));
  icon.appendChild(createSvg(item.type === 'folder' ? ICONS.folder : getIconPaths(item.name)));
  row.appendChild(icon);

  const details = document.createElement('div');
  details.className = 'nav-details';
  const nameEl = document.createElement('div');
  nameEl.className = 'nav-name';
  nameEl.textContent = item.name;
  details.appendChild(nameEl);
  if (item.type === 'file' && item.modified) {
    const meta = document.createElement('div');
    meta.className = 'nav-meta';
    meta.textContent = formatDate(item.modified);
    details.appendChild(meta);
  }
  row.appendChild(details);

  if (item.type === 'folder') {
    const badge = document.createElement('span');
    badge.className = 'nav-badge';
    badge.textContent = countItems(item);
    row.appendChild(badge);

    const chev = document.createElement('span');
    chev.className = 'nav-chevron';
    chev.appendChild(createSvg(ICONS.chevron));
    chev.querySelector('svg').setAttribute('width', '14');
    chev.querySelector('svg').setAttribute('height', '14');
    row.appendChild(chev);
  }

  row.addEventListener('click', () => {
    if (item.type === 'folder') pushFolder(item.name);
    else selectFile(item.name);
  });

  return row;
}

// Render card
function renderCard(direction) {
  const viewport = document.getElementById('stackViewport');
  const folder = getCurrentFolder();
  const items = sortItems(folder.children || []);

  // Remove search results if visible
  const sr = viewport.querySelector('.search-results');
  if (sr) sr.remove();

  const oldCard = viewport.querySelector('.stack-card:not(.exiting-left):not(.exiting-right)');

  const card = document.createElement('div');
  card.className = 'stack-card';
  if (direction) card.classList.add(direction === 'push' ? 'entering-right' : 'entering-left');

  if (items.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'search-empty';
    const emptyIcon = document.createElement('span');
    emptyIcon.className = 'search-empty-icon';
    emptyIcon.textContent = '\uD83D\uDCC2';
    empty.appendChild(emptyIcon);
    empty.appendChild(document.createTextNode('Empty folder'));
    card.appendChild(empty);
  } else {
    items.forEach((item, i) => card.appendChild(createNavItem(item, i)));
  }

  viewport.appendChild(card);

  if (oldCard && direction) {
    oldCard.classList.add(direction === 'push' ? 'exiting-left' : 'exiting-right');
    oldCard.addEventListener('animationend', () => oldCard.remove());
  } else if (oldCard) {
    oldCard.remove();
  }

  updateFooter(items);
}

function updateFooter(items) {
  const folders = items.filter(i => i.type === 'folder').length;
  const files = items.filter(i => i.type === 'file').length;
  const parts = [];
  if (folders) parts.push(folders + ' folder' + (folders > 1 ? 's' : ''));
  if (files) parts.push(files + ' file' + (files > 1 ? 's' : ''));
  document.getElementById('footerCount').textContent = parts.join(' \u00b7 ') || 'empty';
}

// Navigation
function pushFolder(name) {
  pathStack.push(name);
  renderBreadcrumb();
  renderCard('push');
}

function popTo(depth) {
  if (depth >= pathStack.length) return;
  pathStack = pathStack.slice(0, depth);
  renderBreadcrumb();
  renderCard('pop');
}

function selectFile(name) {
  selectedFile = name;
  addRecent(name);
  document.querySelectorAll('.stack-card .nav-item').forEach(el => {
    el.classList.toggle('selected', el.dataset.name === name);
  });
}

// Recents
function addRecent(name) {
  recents = recents.filter(r => r !== name);
  recents.unshift(name);
  recents = recents.slice(0, 5);
  localStorage.setItem('stacknav_recents', JSON.stringify(recents));
  renderRecents();
}

function renderRecents() {
  const strip = document.getElementById('recentsStrip');
  const row = document.getElementById('recentsRow');
  if (recents.length === 0) { strip.style.display = 'none'; return; }
  strip.style.display = 'block';
  row.replaceChildren();

  const dotColors = { md: 'var(--file-md)', pdf: 'var(--file-pdf)', pptx: 'var(--file-pptx)', ppt: 'var(--file-pptx)' };

  recents.forEach(name => {
    const chip = document.createElement('div');
    chip.className = 'recent-chip';
    chip.title = name;
    chip.dataset.name = name;

    const dot = document.createElement('span');
    dot.className = 'dot';
    const ext = getExt(name);
    dot.style.background = dotColors[ext] || 'var(--file-other)';
    chip.appendChild(dot);

    chip.appendChild(document.createTextNode(getDisplayName(name)));

    chip.addEventListener('click', () => {
      const loc = findFile(name);
      if (loc) {
        pathStack = loc.path;
        renderBreadcrumb();
        renderCard(null);
        selectFile(name);
      }
    });

    row.appendChild(chip);
  });
}

function findFile(name, node, path) {
  node = node || DATA;
  path = path || [];
  for (const child of (node.children || [])) {
    if (child.type === 'file' && child.name === name) return { path: [...path] };
    if (child.type === 'folder') {
      const r = findFile(name, child, [...path, child.name]);
      if (r) return r;
    }
  }
  return null;
}

// Search
function getAllFiles(node, path) {
  const results = [];
  for (const child of (node.children || [])) {
    if (child.type === 'file') {
      results.push({ name: child.name, modified: child.modified, folder: path.join(' / ') || 'root', path: [...path] });
    }
    if (child.type === 'folder') {
      results.push(...getAllFiles(child, [...path, child.name]));
    }
  }
  return results;
}

function fuzzyMatch(query, text) {
  const q = query.toLowerCase();
  const t = text.toLowerCase();
  if (t.includes(q)) return true;
  let qi = 0;
  for (let ti = 0; ti < t.length && qi < q.length; ti++) {
    if (t[ti] === q[qi]) qi++;
  }
  return qi === q.length;
}

function renderSearch(query) {
  const viewport = document.getElementById('stackViewport');
  let sr = viewport.querySelector('.search-results');
  if (!query) {
    if (sr) sr.remove();
    return;
  }

  const allFiles = getAllFiles(DATA, []);
  const matches = allFiles.filter(f => fuzzyMatch(query, f.name));

  // Group by folder
  const groups = {};
  matches.forEach(f => {
    const key = f.folder || 'root';
    if (!groups[key]) groups[key] = [];
    groups[key].push(f);
  });

  if (!sr) {
    sr = document.createElement('div');
    sr.className = 'search-results';
    viewport.appendChild(sr);
  }

  sr.replaceChildren();

  if (matches.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'search-empty';
    const emptyIcon = document.createElement('span');
    emptyIcon.className = 'search-empty-icon';
    emptyIcon.textContent = '\uD83D\uDD0D';
    empty.appendChild(emptyIcon);
    empty.appendChild(document.createTextNode('No results for "' + query + '"'));
    sr.appendChild(empty);
    return;
  }

  let idx = 0;
  for (const [folder, files] of Object.entries(groups)) {
    const label = document.createElement('div');
    label.className = 'search-group-label';
    label.textContent = folder;
    sr.appendChild(label);

    files.forEach(f => {
      const row = document.createElement('div');
      row.className = 'nav-item';
      row.style.animationDelay = (idx * 20) + 'ms';
      row.dataset.name = f.name;

      const icon = document.createElement('div');
      icon.className = 'nav-icon ' + getFileClass(f.name);
      icon.appendChild(createSvg(getIconPaths(f.name)));
      row.appendChild(icon);

      const details = document.createElement('div');
      details.className = 'nav-details';
      const nameEl = document.createElement('div');
      nameEl.className = 'nav-name';
      nameEl.textContent = f.name;
      details.appendChild(nameEl);
      const meta = document.createElement('div');
      meta.className = 'nav-meta';
      meta.textContent = formatDate(f.modified);
      details.appendChild(meta);
      row.appendChild(details);

      row.addEventListener('click', () => {
        pathStack = f.path;
        document.getElementById('searchInput').value = '';
        renderBreadcrumb();
        renderCard(null);
        selectFile(f.name);
        sr.remove();
      });

      sr.appendChild(row);
      idx++;
    });
  }

  document.getElementById('footerCount').textContent = matches.length + ' result' + (matches.length !== 1 ? 's' : '');
}

// Init
renderBreadcrumb();
renderCard(null);
renderRecents();

// Search input
const searchInput = document.getElementById('searchInput');
let searchTimeout;
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => renderSearch(searchInput.value.trim()), 150);
});

searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    searchInput.value = '';
    searchInput.blur();
    renderSearch('');
  }
});

// Cmd+K shortcut
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    searchInput.focus();
    searchInput.select();
  }
});
</script>
